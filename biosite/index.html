<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isa D'Elia Art — links e contato</title>
  <meta name="description" content="Galeria, WhatsApp, Instagram e e-mail da Isa D'Elia, artista visual. Todos os links em um só lugar.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🖼️%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="luz" aria-hidden="true"></div>

  <main class="bio">
    <!-- Avatar emoldurado como quadro -->
    <header class="bio-topo">
      <div class="moldura avatar">
        <div class="passpartout"><img id="foto" alt="Foto do artista"></div>
      </div>
      <button class="placa handle" id="handle" title="Clique para copiar o link desta página"></button>
    </header>

    <h1 id="nome">…</h1>
    <p class="frase" id="frase"></p>
    <p class="status" id="status"><span class="ponto" aria-hidden="true"></span><span id="status-texto"></span></p>

    <!-- Botões de links -->
    <nav class="links" id="links" aria-label="Meus links"></nav>

    <footer class="bio-rodape">
      <button id="compartilhar" class="btn-mini">🔗 Copiar link desta página</button>
      <p>Feito com 🖼️ e carinho · <span id="marca">MuseuAI</span> · <span id="ano"></span></p>
    </footer>
  </main>

  <!-- ===================== POPUP DE E-MAIL ===================== -->
  <div id="popup-email" class="popup-email" hidden>
    <div class="popup-email-fundo" data-fechar-email></div>
    <div class="popup-email-caixa" role="dialog" aria-modal="true" aria-labelledby="popup-email-titulo">
      <button class="popup-email-fechar" data-fechar-email aria-label="Fechar (Esc)">✕</button>
      <p class="popup-email-sobre">Contato</p>
      <h3 id="popup-email-titulo">Enviar e-mail</h3>
      <p class="popup-email-para">Para: <strong id="popup-email-para">—</strong></p>
      <label class="popup-email-campo">
        <span>Assunto</span>
        <input id="popup-email-assunto" type="text" maxlength="140">
      </label>
      <label class="popup-email-campo">
        <span>Mensagem</span>
        <textarea id="popup-email-corpo" rows="5" maxlength="2000"></textarea>
      </label>
      <div class="popup-email-acoes">
        <a id="popup-email-gmail" class="popup-email-btn popup-email-primario" target="_blank" rel="noopener">Abrir no Gmail</a>
        <a id="popup-email-outlook" class="popup-email-btn popup-email-secundario" target="_blank" rel="noopener">Abrir no Outlook</a>
        <button id="popup-email-copiar" type="button" class="popup-email-btn popup-email-secundario">Copiar mensagem</button>
      </div>
      <p class="popup-email-dica">Abre o seu e-mail já com assunto e mensagem preenchidos — é só conferir e enviar. Se preferir, copie a mensagem e coloque no aplicativo que quiser.</p>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
